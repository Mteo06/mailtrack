<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MailTrack</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:300px;font:13px/1.5 'Segoe UI',system-ui,sans-serif;background:#fff;color:#202124}
    header{display:flex;align-items:center;gap:8px;padding:14px 16px;background:#1a73e8;color:#fff}
    header h1{font-size:15px;font-weight:600;flex:1}
    .dot{width:8px;height:8px;border-radius:50%;background:#34a853}
    .dot.off{background:#9aa0a6}
    section{padding:12px 16px;border-bottom:1px solid #e8eaed}
    .row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
    .row:last-child{border-bottom:none}
    label{font-weight:500;font-size:13px}
    .sub{font-size:11px;color:#5f6368;margin-top:1px}
    .toggle{position:relative;width:38px;height:20px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .slider{position:absolute;inset:0;background:#9aa0a6;border-radius:20px;cursor:pointer;transition:.2s}
    .slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
    input:checked+.slider{background:#1a73e8}
    input:checked+.slider::before{transform:translateX(18px)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
    .card{background:#f8f9fa;border-radius:8px;padding:10px 12px}
    .val{font-size:24px;font-weight:700;color:#1a73e8;font-variant-numeric:tabular-nums}
    .lbl{font-size:11px;color:#5f6368;margin-top:2px}
    .feed{max-height:160px;overflow-y:auto}
    .item{display:flex;align-items:flex-start;gap:8px;padding:8px 16px;border-bottom:1px solid #f1f3f4;font-size:12px}
    .item:last-child{border-bottom:none}
    .empty{padding:18px;text-align:center;color:#9aa0a6;font-size:12px}
    .time{color:#9aa0a6;font-size:11px;margin-top:2px}
    footer{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
    .btn{display:block;width:100%;padding:8px;border:none;border-radius:6px;
      font-size:13px;font-weight:500;cursor:pointer;text-align:center;text-decoration:none}
    .primary{background:#1a73e8;color:#fff}
    .primary:hover{background:#1558b0}
    .ghost{background:transparent;color:#5f6368;border:1px solid #dadce0}
    .ghost:hover{background:#f1f3f4}
    #logged-out{padding:20px 16px;text-align:center}
    #logged-out p{color:#5f6368;margin-bottom:12px;line-height:1.5}
    #logged-in{display:none}
    .section-title{padding:6px 16px 2px;font-size:11px;font-weight:600;color:#5f6368;text-transform:uppercase;letter-spacing:.05em}
  </style>
</head>
<body>
  <header>
    <div class="dot off" id="dot"></div>
    <h1>MailTrack</h1>
  </header>

  <div id="logged-out">
    <p>Sign in to track email opens and link clicks in Gmail.</p>
    <a href="https://your-backend.com/auth/google" target="_blank" class="btn primary">Sign in with Google</a>
    <p style="margin-top:10px;font-size:11px;color:#9aa0a6">Tracking is opt-in. Email content is never stored.</p>
  </div>

  <div id="logged-in">
    <section>
      <div class="row">
        <div><label>Enable Tracking</label><div class="sub">For all new emails you send</div></div>
        <label class="toggle"><input type="checkbox" id="t-global"><span class="slider"></span></label>
      </div>
      <div class="row">
        <div><label>IP Anonymization</label><div class="sub">Mask recipient IP (GDPR)</div></div>
        <label class="toggle"><input type="checkbox" id="t-anon" checked><span class="slider"></span></label>
      </div>
    </section>

    <div class="stats">
      <div class="card"><div class="val" id="v-opens">—</div><div class="lbl">Total Opens</div></div>
      <div class="card"><div class="val" id="v-clicks">—</div><div class="lbl">Total Clicks</div></div>
    </div>

    <div class="section-title">Recent Activity</div>
    <div class="feed" id="feed"><div class="empty">No events yet</div></div>

    <footer>
      <a href="https://your-frontend.com/dashboard" target="_blank" class="btn primary">Open Dashboard</a>
      <button class="btn ghost" id="btn-logout">Sign out</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
